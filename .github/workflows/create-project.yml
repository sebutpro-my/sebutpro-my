name: Create SebutPro Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check existing project
        run: |
          if [ -e pubspec.yaml ] || [ -d lib ]; then
            echo "Flutter project files already exist. Stopping."
            exit 1
          fi

      - name: Generate Flutter project
        run: |
          flutter create --platforms=android,web --project-name sebutpro_my --org my.sebutpro .

      - name: Validate project
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Initialize SebutPro MY Flutter project"
          git push origin HEAD:main
